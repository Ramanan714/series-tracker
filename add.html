<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Add New Series - Series Tracker</title>
    <!-- Font Awesome 6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="add.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
        <!-- Add Page Loading Animation -->
    <div id="loadingAnimation" class="loading-animation add-animation">
        <div class="loading-glass-card add-glass-card">
            <div class="loading-icon">
                <i class="fas fa-plus-circle"></i>
            </div>
            <div class="loading-title">Adding New Item</div>
            <div class="loading-progress-container">
                <div class="loading-progress-bar">
                    <div class="loading-progress-fill" id="addProgressFill">
                        <div class="loading-flame" id="addFlame">
                            <i class="fas fa-fire"></i>
                        </div>
                    </div>
                </div>
                <div class="loading-percentage" id="addPercentage">0%</div>
            </div>
            <div class="loading-hint">
                <i class="fas fa-mouse-pointer"></i> Click anywhere to skip
            </div>
        </div>
    </div>
    <div class="app-container">
        <!-- Top Bar from app.js will be injected here -->
        
        <!-- Local Navigation Bar (not sticky) -->
        <div class="local-nav-bar">
            <button class="back-btn" id="backBtn">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="page-title">Add New Series</h1>
            <button class="trash-btn" id="trashBtn">
                <i class="fas fa-trash-alt"></i>
            </button>
        </div>

        <div class="container">
            <!-- Info Box -->
            <div class="info-box">
                <i class="fas fa-info-circle"></i>
                <span>Add your series, anime, manga, or movie here. Fill the details below.</span>
            </div>

                        <!-- User Greeting Card -->
            <div class="greeting-card">
                <div class="greeting-card-content">
                    <div class="greeting-avatar">
                        <img id="greetingAvatar" class="greeting-avatar-img" src="https://ui-avatars.com/api/?background=2563EB&color=fff&bold=true&size=80&name=User" alt="Profile">
                    </div>
                    <div class="greeting-info">
                        <h3 id="greetingUserName">Guest User</h3>
                        <p id="greetingText">Good Morning!</p>
                        <p id="liveClock" class="greeting-clock">--</p>
                    </div>
                </div>
            </div>

            <!-- Modal Form -->
            <div class="form-container">
                <h3><i class="fas fa-plus-circle"></i> Add New Item</h3>
                
                <form id="addForm">
                    <!-- Title Field -->
                    <div class="form-group">
                        <label><i class="fas fa-heading"></i> Title <span class="required">*</span></label>
                        <input type="text" id="title" class="form-input" placeholder="enter title" autocomplete="off" required>
                    </div>

                    <!-- Category Field -->
                    <div class="form-group">
                        <label><i class="fas fa-tags"></i> Category</label>
                        <div class="category-select-wrapper">
                            <select id="category" class="form-input category-select">
                                <option value="">Select category...</option>
                            </select>
                            <button type="button" id="addCategoryBtn" class="add-category-btn">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Status Field -->
                    <div class="form-group">
                        <label><i class="fas fa-flag-checkered"></i> Status</label>
                        <div class="status-capsules">
                            <button type="button" class="status-chip" data-status="Watching">
                                <i class="fas fa-eye"></i> Watching/Reading
                            </button>
                            <button type="button" class="status-chip" data-status="Plan to Watch">
                                <i class="fas fa-calendar-plus"></i> Plan to Watch
                            </button>
                            <button type="button" class="status-chip" data-status="On Hold">
                                <i class="fas fa-pause"></i> On Hold
                            </button>
                            <button type="button" class="status-chip" data-status="Dropped">
                                <i class="fas fa-ban"></i> Dropped
                            </button>
                            <button type="button" class="status-chip" data-status="Completed">
                                <i class="fas fa-check-circle"></i> Completed
                            </button>
                        </div>
                        <input type="hidden" id="selectedStatus" value="">
                    </div>

                    <!-- Priority Field (shown only for Plan to Watch) -->
                    <div id="priorityContainer" class="form-group priority-container" style="display: none;">
                        <label><i class="fas fa-chart-line"></i> Priority</label>
                        <div class="priority-capsules">
                            <button type="button" class="priority-chip" data-priority="High">
                                <i class="fas fa-arrow-up"></i> High
                            </button>
                            <button type="button" class="priority-chip" data-priority="Medium">
                                <i class="fas fa-minus"></i> Medium
                            </button>
                            <button type="button" class="priority-chip" data-priority="Low">
                                <i class="fas fa-arrow-down"></i> Low
                            </button>
                        </div>
                        <input type="hidden" id="selectedPriority" value="">
                    </div>

                    <!-- Progress Field -->
                    <div class="form-group">
                        <label><i class="fas fa-chart-line"></i> Progress</label>
                        <input type="text" id="progress" class="form-input" placeholder="Enter progress..." maxlength="15">
                        <div class="progress-helpers">
                            <button type="button" class="helper-chip" data-helper="EP ">Episode</button>
                            <button type="button" class="helper-chip" data-helper="CH ">Chapter</button>
                            <button type="button" class="helper-chip" data-helper="MIN ">Duration</button>
                        </div>
                    </div>

                    <!-- Current Season Field -->
                    <div class="form-group">
                        <label><i class="fas fa-layer-group"></i> Current Season</label>
                        <input type="text" id="season" class="form-input" placeholder="Season (optional)">
                        <div class="progress-helpers">
                            <button type="button" class="helper-chip-season" data-helper="Season ">Season</button>
                            <button type="button" class="helper-chip-arch" data-helper="Arch ">Arch</button>
                        </div>
                    </div>

                    <!-- Notes Field -->
                    <div class="form-group">
                        <label><i class="fas fa-pen"></i> Notes</label>
                        <textarea id="notes" class="form-textarea" rows="2" placeholder="Add personal notes..."></textarea>
                    </div>

                    <!-- Favorite & Completed Toggle Buttons -->
                    <div class="toggle-buttons">
                        <button type="button" id="favoriteToggle" class="toggle-btn">
                            <i class="fas fa-star"></i> Favorite
                        </button>
                        <button type="button" id="completedToggle" class="toggle-btn">
                            <i class="fas fa-check-circle"></i> Completed
                        </button>
                    </div>

                    <!-- Save & Reset Buttons -->
                    <div class="action-buttons">
                        <button type="submit" class="save-btn"><i class="fas fa-save"></i> Save</button>
                        <button type="button" id="resetBtn" class="reset-btn"><i class="fas fa-undo-alt"></i> Reset</button>
                        <button type="button" id="deleteFormBtn" class="delete-btn"><i class="fas fa-trash-alt"></i> Delete</button>
                    </div>
                </form>
            </div>

            <!-- Recently Added Section -->
            <div class="recent-section">
                <h3><i class="fas fa-clock"></i> Recently Added</h3>
                <div id="recentList" class="recent-grid">
                    <!-- Dynamic content -->
                </div>
            </div>
        </div>

        <!-- Footer Bar -->
        <div id="footerBar" class="footer-bar">
            <p>© 2026 Series Tracker | Track your favorite series easily</p>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div id="categoryModal" class="modal-overlay" style="display: none;">
        <div class="modal-content small-modal">
            <div class="modal-header">
                <i class="fas fa-plus-circle"></i>
                <h3>Add New Category</h3>
                <button class="modal-close" onclick="closeCategoryModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="text" id="newCategoryName" class="form-input" placeholder="Enter category name" autocomplete="off">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn cancel-btn" onclick="closeCategoryModal()">Cancel</button>
                <button class="modal-btn confirm-btn" id="confirmCategoryBtn">Add Category</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fas fa-pencil-alt"></i>
                <h3>Edit Series</h3>
                <button class="modal-close" onclick="closeEditModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="editId">
                    <div class="form-group">
                        <label>Title <span class="required">*</span></label>
                        <input type="text" id="editTitle" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="editCategory" class="form-input"></select>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="editStatus" class="form-input">
                            <option value="Watching">Watching/Reading</option>
                            <option value="Plan to Watch">Plan to Watch</option>
                            <option value="On Hold">On Hold</option>
                            <option value="Dropped">Dropped</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    <div class="form-group" id="editPriorityGroup" style="display: none;">
                        <label>Priority</label>
                        <select id="editPriority" class="form-input">
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Progress</label>
                        <input type="text" id="editProgress" class="form-input" maxlength="15">
                    </div>
                    <div class="form-group">
                        <label>Season</label>
                        <input type="text" id="editSeason" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="editNotes" class="form-textarea" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn cancel-btn" onclick="closeEditModal()">Cancel</button>
                <button class="modal-btn confirm-btn" id="confirmEditBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="theme.js"></script>
    <script src="app.js"></script>
    <script src="add.js"></script>
</body>
</html>
