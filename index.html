<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Series Tracker - Dashboard</title>
    <!-- Font Awesome 6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Loading Animation -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-container">
            <div class="loading-bar"></div>
            <div class="loading-text">Loading Series Tracker...</div>
        </div>
    </div>

    <div class="app-container">
        <div class="container">
                        <!-- User Greeting Card -->
            <div class="greeting-card">
                <div class="greeting-card-content">
                    <div class="greeting-avatar">
                        <img id="greetingAvatar" class="greeting-avatar-img" src="https://ui-avatars.com/api/?background=2563EB&color=fff&bold=true&size=80&name=User" alt="Profile">
                    </div>
                    <div class="greeting-info">
                        <h3 id="greetingUserName">Guest User</h3>
                        <p id="greetingText">Good Morning!</p>
                        <p id="liveClock" class="greeting-clock">--</p>
                    </div>
                </div>
            </div>

            <!-- Quick Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-eye"></i>
                    <div class="stat-info">
                        <span class="stat-value" id="watchingCount">0</span>
                        <span class="stat-label">Watching</span>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-check-circle"></i>
                    <div class="stat-info">
                        <span class="stat-value" id="completedCount">0</span>
                        <span class="stat-label">Completed</span>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-star"></i>
                    <div class="stat-info">
                        <span class="stat-value" id="favoritesCount">0</span>
                        <span class="stat-label">Favorites</span>
                    </div>
                </div>
            </div>

            <!-- Navigation Buttons - NEW SECTION -->
            <div class="nav-buttons-section">
                <button class="nav-page-btn" data-page="add">
                    <i class="fas fa-plus-circle"></i> Add New
                </button>
                <button class="nav-page-btn" data-page="remove">
                    <i class="fas fa-trash-alt"></i> Remove
                </button>
                <button class="nav-page-btn" data-page="favorites">
                    <i class="fas fa-star"></i> Favorites
                </button>
                <button class="nav-page-btn" data-page="wishlist">
                    <i class="fas fa-heart"></i> Wishlist
                </button>
                <button class="nav-page-btn" data-page="profile">
                    <i class="fas fa-user"></i> Profile
                </button>
            </div>

            <!-- Filters Section -->
            <div class="filters-section">
                <div class="filter-group">
                    <label><i class="fas fa-tags"></i> Categories</label>
                    <div id="categoryFilters" class="filter-chips"></div>
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-filter"></i> Status</label>
                    <div id="statusFilters" class="filter-chips"></div>
                </div>
                <div class="filter-group">
                    <label><i class="fas fa-sort"></i> Sort By</label>
                    <div id="sortFilters" class="filter-chips"></div>
                </div>
            </div>

            <!-- Search Bar (moved here) -->
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search by title..." class="search-input">
                <button id="clearSearchBtn" class="clear-search-btn"><i class="fas fa-times"></i></button>
            </div>

            <!-- Series Cards Grid -->
            <div id="seriesGrid" class="series-grid">
                <!-- Cards will be dynamically inserted here -->
                <div class="empty-state">
                    <i class="fas fa-tv"></i>
                    <p>No series found</p>
                    <p class="empty-hint">Add your first series using the + button in menu</p>
                </div>
            </div>
        </div>

        <!-- Footer Bar (appears on scroll up) -->
        <div id="footerBar" class="footer-bar">
            <p>© 2026 Series Tracker | Track your favorite series easily</p>
        </div>
    </div>

    <!-- Edit Modal (same as add page) -->
    <div id="editModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fas fa-pencil-alt"></i>
                <h3>Edit Series</h3>
                <button class="modal-close" onclick="closeEditModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="editId">
                    <div class="form-group">
                        <label>Title <span class="required">*</span></label>
                        <input type="text" id="editTitle" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="editCategory" class="form-input"></select>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="editStatus" class="form-input">
                            <option value="Watching">Watching/Reading</option>
                            <option value="Plan to Watch">Plan to Watch</option>
                            <option value="On Hold">On Hold</option>
                            <option value="Dropped">Dropped</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    <div class="form-group" id="editPriorityGroup" style="display: none;">
                        <label>Priority</label>
                        <select id="editPriority" class="form-input">
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Progress</label>
                        <input type="text" id="editProgress" class="form-input" maxlength="15">
                    </div>
                    <div class="form-group">
                        <label>Season</label>
                        <input type="text" id="editSeason" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="editNotes" class="form-textarea" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn cancel-btn" onclick="closeEditModal()">Cancel</button>
                <button class="modal-btn confirm-btn" id="confirmEditBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="theme.js"></script>
    <script src="app.js"></script>
    <script src="index.js"></script>
</body>
</html>
